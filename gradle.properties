# 1.24.1 = CRITICAL eye fix + UI fix + full release audit, from user testing ("1000 seeds, never
#          found 2 eyes" — a ~1-in-3 event, so the engine was BROKEN, not slow):
#          (1) ROOT CAUSE (found by building a headless world-gen test harness, gradlew eyeDiag):
#          CountingLevel.getChunk returned null, but StructurePiece.placeBlock calls
#          getChunk(pos).markPosForPostprocessing(pos) for shape-check blocks (iron bars, panes,
#          stairs — strongholds are full of them), so it NPE'd on the FIRST such block; the eye
#          counter caught it and returned -1 (can't tell) for EVERY seed → every seed rejected →
#          the search ran forever and found nothing. FIX: getChunk now returns a throwaway ProtoChunk
#          (PalettedContainerFactory.create(registries)) so that call is a harmless no-op. VERIFIED
#          headless over 300 seeds: a textbook binomial(12,0.1) spread (0:91 1:105 2:66 3:27 4:10
#          5:1), 104/300 with >=2 eyes vs ~102 expected — the engine now returns the game's real
#          counts. (Bonus: because it now actually MATCHES, low-eye searches finish fast instead of
#          running forever.) (2) UI: the create-world feedback line no longer renders on top of the
#          Fast/Exact toggle (moved the toggle up a row). (3) RELEASE AUDIT: re-confirmed exactly 3
#          network endpoints (all in AiVision.java), API keys sent in headers (never URLs), never
#          logged, never shown on screen (the key box never prefills the saved key); seed finder,
#          bots, builder and the eye engine make ZERO network calls; no shell/process execution.
#          NEW dev-only headless harness src/test/java/EyeDiagnostic + `gradlew eyeDiag` (not shipped).
