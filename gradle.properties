#          rare-structure combos; pure common searches unchanged.
#          (2) Biome checks: sampling step 16 → 32 (4x fewer samples); SIZE requests locate with a
#          coarse grid (a patch smaller than the step can't pass minSpan anyway) — dozens of samples
#          instead of thousands; the span measure re-centers once into the patch middle (an edge hit
#          understated the size and rejected seeds that actually qualified). Size thresholds softened:
#          big 250→224, huge 450→384 — still "ginormous", far more findable.
#          (3) MORE BOTS: searches started from the menu / Create World screen now use EVERY CPU core
#          at normal priority (nothing else needs the CPU there); searches inside a world stay
#          cores-1 at low priority so the game stays smooth. The search screens show "N bots".
