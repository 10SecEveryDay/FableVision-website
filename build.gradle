plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom adds the Fabric + Mojang repos automatically.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // MC 26.1.2 ships de-obfuscated (Mojang names are already baked in), so Loom needs NO
    // mappings layer. Declaring one throws "Cannot use Mojang mappings in a non-obfuscated
    // environment". This matches the official Fabric 26.1.2 template, which omits mappings
    // and uses plain `implementation` (nothing to remap).
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// ── Java version ───────────────────────────────────────────────────────────
// MC 26.1.2 is compiled for Java 25 (matches the official Fabric template), so
// we target 25. The foojay resolver in settings.gradle auto-downloads JDK 25
// if it isn't installed, so you don't have to install it yourself.
def targetJavaVersion = 25

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

// ── Headless worldgen diagnostic (dev-only, never shipped) ───────────────────
// Runs the seed-finder's real world-gen code OUTSIDE the game so results can be
// verified without launching Minecraft. VanillaRegistries.createLookup() is on the
// deobf compile jar even though it's absent from the shipped client jar.
tasks.register('eyeDiag', JavaExec) {
    group = 'verification'
    description = 'Headless check of the stronghold eye counter.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.fablevision.EyeDiagnostic'
    jvmArgs = ['-Djava.awt.headless=true']
}

tasks.register('speedDiag', JavaExec) {
    group = 'verification'
    description = 'Headless timing + hit-rate check of the seed finder (where do the ms go?).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.fablevision.SpeedDiagnostic'
    jvmArgs = ['-Djava.awt.headless=true']
}

// The eye diagnostic above is a plain main(), not a JUnit test, so `test` finds nothing to run —
// that's expected for this dev-only harness, not a misconfiguration.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}
